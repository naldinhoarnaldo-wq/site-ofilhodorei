<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Filho do Rei | Arnaldo Carriel - Gestor de E-commerce</title>
    <meta name="description" content="Site oficial de Arnaldo Carriel (O Filho do Rei). Operador nato de e-commerce focado em eliminar gargalos operacionais e blindar o lucro real de quem vende no digital.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050505;
            --bg-surface: #111111;
            --gold-light: #F9F295;
            --gold-main: #E0AA3E;
            --gold-dark: #B8860B;
            --gold-gradient: linear-gradient(135deg, #F9F295 0%, #E0AA3E 50%, #B8860B 100%);
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --border-color: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- MENU SUPERIOR FIXO / HEADER --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            color: var(--gold-main);
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-logo span.crown {
            font-size: 1.2rem;
            filter: drop-shadow(0 2px 4px rgba(224, 170, 62, 0.4));
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--gold-main);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.8rem;
            color: var(--gold-main);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 160px 20px 100px;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 80px;
            align-items: center;
            justify-items: start;
        }

        .hero-image-box {
            width: 100%;
            max-width: 320px;
            height: 420px;
            border-radius: 8px;
            border: 2px solid var(--gold-main);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(224, 170, 62, 0.15);
            background: #000;
        }

        .hero-image-box img {
            width: 100%;
            height: 100%;
            /* Esta linha garante que a imagem preencha o quadrado sem distorcer */
            object-fit: cover; 
            object-position: center;
        }

        .expert-tag {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .expert-tag span.crown {
            font-size: 1.5rem;
            filter: drop-shadow(0 2px 4px rgba(224, 170, 62, 0.4));
        }

        .expert-sub {
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .hero-content {
            text-align: left;
        }

        .hero-content p.main-desc {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-weight: 300;
        }

        /* --- BUTTONS --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 30px;
            font-size: 0.95rem;
            font-weight: 600;
            color: #000000;
            background: var(--gold-gradient);
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(224, 170, 62, 0.2);
            width: 100%;
            text-align: center;
            margin-top: 12px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(224, 170, 62, 0.4);
            filter: brightness(1.1);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--gold-main);
            color: var(--gold-main);
            box-shadow: none;
        }

        .btn-outline:hover {
            background: rgba(224, 170, 62, 0.1);
            color: var(--gold-light);
        }

        /* --- SECTIONS --- */
        .section {
            padding: 100px 0;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 60px;
            color: var(--gold-main);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* --- GRIDS & CARDS --- */
        .grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            align-items: stretch;
            margin-bottom: 32px;
        }

        .grid-partners-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 32px;
            max-width: 920px;
            margin: 0 auto 32px auto;
            align-items: stretch;
        }

        .card {
            background-color: var(--bg-surface);
            padding: 28px 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
            height: 100%;
        }

        .card:hover {
            border-color: #333;
            transform: translateY(-5px);
        }

        .partner-card {
            background-color: var(--bg-surface);
            padding: 28px 24px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            position: relative;
        }

        .partner-card:hover {
            border-color: #333;
            transform: translateY(-5px);
        }

        /* Imagens dos cards de Soluções */
        .card .card-img-box {
            width: 100%;
            height: 200px;
            border-radius: 6px;
            border: none;
            overflow: hidden;
            margin-bottom: 16px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Caixa de imagem dos Parceiros */
        .partner-card .card-img-box {
            width: 100%;
            height: 180px;
            border-radius: 6px;
            border: none;
            overflow: hidden;
            margin-bottom: 16px;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .partner-card .card-img-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .card h3, .partner-card h3 {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .card p, .partner-card p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-weight: 300;
            font-size: 0.9rem;
        }

        /* --- ABOUT BOX --- */
        .about-box {
            background: var(--bg-surface);
            border-left: 2px solid var(--gold-main);
            padding: 48px;
            border-radius: 4px;
            position: relative;
        }

        .about-box h2 {
            font-size: 2rem;
            margin-bottom: 24px;
            color: var(--gold-main);
        }

        .about-box p {
            color: var(--text-secondary);
            margin-bottom: 16px;
            font-size: 1.1rem;
            font-weight: 300;
        }

        /* --- CUPOM / BENEFICIO STYLES --- */
        .cupom-box {
            background: rgba(224, 170, 62, 0.05);
            border: 1px dashed var(--gold-main);
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            margin-top: auto;
        }

        .cupom-code {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-top: 4px;
            background: #000;
            padding: 6px;
            display: inline-block;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            width: 100%;
            line-height: 1.4;
        }

        /* --- YOUTUBE SECTION --- */
        .youtube-container {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            height: 0;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            background: #000;
            margin-top: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .youtube-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-family: 'Cinzel', serif;
            letter-spacing: 1px;
        }

        @media (max-width: 1024px) {
            .grid-3, .grid-partners-2 { grid-template-columns: 1fr; }
        }

        @media (max-width: 900px) {
            .container, .nav-container { padding: 0 20px; }
            .menu-toggle { display: block; }
            .nav-links {
                position: absolute;
                top: 100%;
                left: 0;
                width: 100%;
                background: rgba(5, 5, 5, 0.98);
                flex-direction: column;
                align-items: center;
                gap: 20px;
                padding: 30px 0;
                border-bottom: 1px solid var(--border-color);
                display: none;
            }
            .nav-links.active { display: flex;
