<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Filho do Rei | Automação e Gestão para Shopee</title>
    <!-- Fontes Premium: Cinzel (Títulos/Logo) e Montserrat (Textos) -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Paleta Premium baseada na sua Logo */
            --bg-base: #050505;
            
            /* Tons de Ouro (Coroa) */
            --gold-light: #F9F295;
            --gold-main: #E0AA3E;
            --gold-dark: #B8860B;
            --gold-gradient: linear-gradient(135deg, #F9F295 0%, #E0AA3E 50%, #B8860B 100%);
            
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            /* Fundo radial simulando a textura da sua marca */
            background-image: radial-gradient(circle at top center, #151515 0%, #000000 100%);
            min-height: 100vh;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 24px;
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 12vh 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .hero h1 {
            font-size: 3.5rem;
            line-height: 1.1;
            margin-bottom: 24px;
            color: var(--text-primary);
            max-width: 900px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hero h1 span {
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1.25rem;
            color: var(--text-secondary);
            max-width: 700px;
            margin: 0 auto 40px auto;
            font-weight: 300;
        }

        /* --- BUTTON --- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 18px 45px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #000000;
            background: var(--gold-gradient);
            border-radius: 4px;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(224, 170, 62, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(224, 170, 62, 0.4);
            filter: brightness(1.1);
        }
        
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION (PRIMEIRA DOBRA) -->
    <header class="hero">
        <div class="container">
            <h1>Pare de perder tempo com trabalho braçal e <span>dinheiro com taxas ocultas.</span></h1>
            <p>Ferramentas de automação e conciliação financeira validadas no campo de batalha para você blindar o seu caixa e escalar sua operação com uma equipe enxuta.</p>
            <a href="#planos" class="btn">PROTEGER MEU LUCRO E MEU TEMPO</a>
        </div>
    </header>

</body>
</html>
