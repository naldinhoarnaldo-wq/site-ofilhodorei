<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O Filho do Rei | Arnaldo Carriel - Gestor de E-commerce</title>
    <meta name="description" content="Site oficial de Arnaldo Carriel (O Filho do Rei). Operador nato de e-commerce focado em eliminar gargalos operacionais e blindar o lucro real de quem vende no digital.">
    <link rel="icon" type="image/png" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #050505;
            --bg-surface: #111111;
            --gold-light: #F9F295;
            --gold-main: #E0AA3E;
            --gold-dark: #B8860B;
            --gold-gradient: linear-gradient(135deg, #F9F295 0%, #E0AA3E 50%, #B8860B 100%);
            --text-primary: #FFFFFF;
            --text-secondary: #B0B0B0;
            --border-color: #2a2a2a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: radial-gradient(circle at center, #111 0%, #000 100%);
        }

        h1, h2, h3 {
            font-family: 'Cinzel', serif;
            font-weight: 700;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- MENU SUPERIOR FIXO / HEADER --- */
        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(5, 5, 5, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
            padding: 15px 0;
        }

        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            color: var(--gold-main);
            font-weight: 700;
            font-size: 1.1rem;
            text-decoration: none;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-logo span.crown {
            font-size: 1.2rem;
            filter: drop-shadow(0 2px 4px rgba(224, 170, 62, 0.4));
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .nav-links a:hover {
            color: var(--gold-main);
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.8rem;
            color: var(--gold-main);
        }

        /* --- HERO SECTION --- */
        .hero {
            padding: 160px 20px 100px;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-grid {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 80px;
            align-items: center;
            justify-items: start;
        }

        .hero-image-box {
            width: 100%;
            max-width: 320px;
            height: 420px;
            border-radius: 8px;
            border: 2px solid var(--gold-main);
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(224, 170, 62, 0.15);
            background: #000;
        }

        .hero-image-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
        }

        .expert-tag {
            font-family: 'Cinzel', serif;
            color: var(--gold-light);
            font-size: 1.6rem;
            letter-spacing: 1px;
            margin-bottom: 2px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
